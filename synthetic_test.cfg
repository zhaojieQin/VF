##################################################
# Synthetic velocity BC test configuration
##################################################

# Grid parameters
nz = 64

# Physical parameters
Ma = 0.1
viscosity = 1.56e-5

# Simulation parameters (in seconds, divided by dt in script to get LBM steps)
tEnd = 10
tStartOut = 0.0
tOut = 0.1

# Turbulence model (QR adds SGS viscosity to stabilize at physical Ma=0.1)
TurbulenceModel = QR
SGSconstant = 0.33333
QuadricLimiterP = 100000.0
QuadricLimiterM = 100000.0
QuadricLimiterD = 100000.0

# Body force
bodyForce = false

# Other
Devices = 0
